[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rag-kg-orchestrator"
version = "0.1.0"
description = "Hyper-modular RAG + knowledge graph orchestration workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "solid" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "openai>=2.8.0",
    "marker-pdf>=1.6.1",
    "crawl4ai>=0.7.7",
    "alembic>=1.17.2",
    "tenacity>=9.1.0",
    "pyvis>=0.3.2",
    "rank-bm25>=0.2.2",  # BM25 scoring for hybrid retrieval (Robertson et al. 1994)
    "loguru>=0.7.3",
    "scipy>=1.11.0",  # Friedman + Wilcoxon tests for benchmark statistics
    "statsmodels>=0.14.0",  # BH FDR correction for pairwise comparisons
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "mypy",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "mypy",
    "faker>=30.0.0",
]

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = [
    ".",
    # Libs (Layer 1)
    "libs/llm_gateway_client",
    "libs/arango_client",
    "libs/minio_client",
    "libs/prompts",

    # Services (Layer 3)
    "services/api",
    "services/worker",
]

[tool.uv.sources]
llm-gateway-client = { workspace = true }
arango-client = { workspace = true }
minio-client = { workspace = true }
prompts = { workspace = true }
api-service = { workspace = true }
worker-service = { workspace = true }

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "T20", "SIM", "PTH", "ARG",
    "RUF", "PLC", "PLE", "PLR", "PLW"
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D203", "D212", "D415", "E501", "B905",
    # Temporarily ignored - need manual refactoring
    "RUF022",   # __all__ not sorted (cosmetic, has comments)
    "PLC0415",  # import not at top-level (lazy loading pattern)
    "PLR0913",  # too many arguments (refactor needed)
    "PLR2004",  # magic value in comparison
    "N805",     # first arg naming (false positive for validators)
    "SIM117",   # nested with statements
    "SIM110",   # use all() instead of for loop
    "PTH123",   # Path.open vs open
    "RUF012",   # mutable class attributes ClassVar
    "RUF005",   # consider iterable unpacking
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLW2901",  # for loop variable overwritten
    "SIM102",   # nested if statements
    "B007",     # unused loop control variable
    "ARG002",   # unused method argument
    "A001",     # shadowing builtin (variable)
    "A002",     # shadowing builtin (argument)
    "N806",     # variable in function should be lowercase
    "PLR0911",  # too many return statements
    "SIM103",   # return condition directly
    "SIM105",   # use contextlib.suppress
    "RUF059",   # unpacked variable never used
    "UP007",    # use X | Y for type annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T201", "F841", "B017", "RUF001", "W293"]  # Allow print, unused vars, blind exception, ambiguous chars in tests
"scripts/**/*.py" = ["T201", "E402", "W293", "RUF015", "PTH109", "C416"]  # Allow print, late imports, whitespace, next(iter) in scripts
"services/**/*.py" = ["B008", "ARG001"]  # Allow Depends() and unused args in FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=prepend"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["docker", "data"]
markers = [
    "integration: integration tests requiring external services (ArangoDB, LLM)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.isort]
profile = "black"
force_single_line = true
lines_after_imports = 2
lines_between_types = 1



