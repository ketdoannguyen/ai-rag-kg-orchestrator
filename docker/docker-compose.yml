version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ../docker/data/redis:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file:
      - .env.dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../docker/data/minio:/data

  arangodb:
    image: arangodb:3.12
    environment:
      - ARANGO_ROOT_PASSWORD=test
    ports:
      - "8529:8529"
    volumes:
      - ../docker/data/arangodb_clean:/var/lib/arangodb3
