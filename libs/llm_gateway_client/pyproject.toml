[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gateway-client"
version = "0.1.0"
description = "A standardized, provider-agnostic client for interacting with LLM + embedding models using LiteLLM."
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
dependencies = [
    "pydantic>=2.7.1",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
    "python-dotenv>=1.0.1",
    "litellm>=1.80.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_gateway_client*"] 