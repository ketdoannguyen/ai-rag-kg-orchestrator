[project]
name = "arango_client"
version = "0.1.0"
description = "ArangoDB client library for multi-model database operations"
requires-python = ">=3.11"
dependencies = [
    "python-arango>=8.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arango_client"]
