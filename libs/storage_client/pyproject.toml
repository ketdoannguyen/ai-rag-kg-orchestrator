[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-client"
version = "0.1.0"
description = "Object storage client"
requires-python = ">=3.11"
dependencies = [
    "minio",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["storage_client*"]


