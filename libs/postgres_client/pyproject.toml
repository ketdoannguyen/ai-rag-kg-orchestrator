[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postgres-client"
version = "0.1.0"
description = "Postgres client for the RAG KG workspace"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy",
    "alembic",
    "asyncpg", # Driver async cho Postgres
    "psycopg[binary]",
    "pgvector",
    "pydantic",
    "loguru",
    "psycopg2-binary>=2.9.11",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["postgres_client*"]


