[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minio-client"
version = "0.2.0"
description = "Object storage client"
requires-python = ">=3.11"
dependencies = [
    "minio",
    "loguru>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["minio_client*"]


