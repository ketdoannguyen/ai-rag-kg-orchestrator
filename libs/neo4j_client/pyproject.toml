[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-client"
version = "0.1.0"
description = "Neo4j driver wrapper"
requires-python = ">=3.11"
dependencies = [
    "neo4j",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neo4j_client*"]


