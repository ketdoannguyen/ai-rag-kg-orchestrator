[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-service"
version = "0.1.0"
description = "Celery worker service"
requires-python = ">=3.11"
dependencies = [
    "celery",
    "postgres-client",
    "llm-gateway-client",
    "workflow-ingest-file",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["worker*"]


