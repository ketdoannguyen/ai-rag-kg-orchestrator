version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "8000:8000"
    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - PYTHONPATH=/app/src

