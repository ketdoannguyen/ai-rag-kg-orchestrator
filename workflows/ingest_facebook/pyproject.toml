[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ingest-facebook"
version = "0.1.0"
description = "Facebook ingestion workflow"
requires-python = ">=3.11"
dependencies = [
    "storage-client",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest_facebook*"]


