[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ingest-file"
version = "0.1.0"
description = "File ingestion workflow"
requires-python = ">=3.11"
dependencies = [
    "postgres-client",
    "neo4j-client",
    "storage-client",
    "pydantic",
    "marker-pdf",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest_file*"]


