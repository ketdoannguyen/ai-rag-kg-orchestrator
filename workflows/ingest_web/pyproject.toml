[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ingest-web"
version = "0.1.0"
description = "Web ingestion workflow"
requires-python = ">=3.11"
dependencies = [
    "storage-client",
    "crawl4ai>=0.3.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "markdown>=3.5.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest_web*"]


