[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-admin-cms"
version = "0.1.0"
description = "Admin CMS workflow"
requires-python = ">=3.11"
dependencies = [
    "postgres-client",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["admin_cms*"]


